name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - run: npm --prefix app ci
      - run: npm --prefix desktop ci
      - run: npm run privacy:check
      - run: npm test
      - run: npm run desktop:test
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Compute installer checksums
        shell: pwsh
        run: |
          Get-ChildItem desktop/release/*-Setup.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content desktop/release/SHA256SUMS.txt -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: |
            desktop/release/*-Setup.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error

