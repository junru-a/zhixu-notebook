name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - run: npm --prefix app ci
      - run: npm --prefix desktop ci --ignore-scripts
      - run: npm run privacy:check
      - run: npm test
      - run: npm run desktop:test
      - run: npm run build
      - run: node desktop/build.mjs
      - run: npm --prefix app audit --audit-level=high

      - run: npm --prefix desktop audit --audit-level=high
